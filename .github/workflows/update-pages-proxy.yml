name: Update Pages Proxy IP

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get best Cloudflare IP
        run: |
          curl -s "https://cdn.jsdelivr.net/gh/XIU2/CloudflareSpeedTest@master/ip.txt" | head -1 > best.txt
          IP=$(cat best.txt)
          echo "BEST_IP=$IP" >> $GITHUB_ENV
          echo "最快的IP: $IP"
      
      - name: Update Pages environment variable via API
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PROJECT_NAME: ${{ secrets.PAGES_PROJECT_NAME }}
        run: |
          curl -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployment/hooks/environment_variables" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"PROXYIP":"${{ env.BEST_IP }}"}'
