name: Update Worker PROXYIP

on:
  schedule:
    - cron: '0 */6 * * *'     # 每6小时自动更新一次（可自行调整）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get fastest IP
        run: |
          curl -s "https://cdn.jsdelivr.net/gh/XIU2/CloudflareSpeedTest@master/ip.txt" | head -1 | cut -d'/' -f1 > ip.txt
          BEST_IP=$(cat ip.txt)
          echo "BEST_IP=$BEST_IP" >> $GITHUB_ENV
          echo "最快的IP: $BEST_IP"
      
      - name: Install wrangler
        run: npm install -g wrangler
      
      - name: Update Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          echo "${{ env.BEST_IP }}" | npx wrangler secret put PROXYIP --name raspy-bush-4b8a
