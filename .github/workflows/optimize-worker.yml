name: Optimize Worker

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get fastest Cloudflare IP
        run: |
          curl -s "https://cdn.jsdelivr.net/gh/XIU2/CloudflareSpeedTest@master/ip.txt" | head -1 | cut -d'/' -f1 > best_ip.txt
          BEST_IP=$(cat best_ip.txt)
          echo "BEST_IP=$BEST_IP" >> $GITHUB_ENV
          echo "最快的IP: $BEST_IP"
      
      - name: Send to Worker
        run: |
          curl -X POST "https://as.asasasd.eu.cc/update_proxyip" \
            -H "Content-Type: text/plain" \
            -d "${{ env.BEST_IP }}"
