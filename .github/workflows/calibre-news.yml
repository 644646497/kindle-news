name: 每日新闻推送
on:
  schedule:
    - cron: '0 12 * * *'  # 北京时间 20:00
  workflow_dispatch:     # 允许手动运行（你要的 RUN 按钮）

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Calibre
        run: sudo apt update && sudo apt install -y calibre

      - name: 生成新闻 recipe
        run: |
          TODAY=$(date +%Y-%m-%d)
          cat > news.recipe << EOF
from calibre.web.feeds.news import BasicNewsRecipe

class 新闻组合(BasicNewsRecipe):
    title          = '日经&BBC全球新闻 '$TODAY
    oldest_article = 1
    max_articles_per_feed = 100
    auto_cleanup = True
    feeds = [
        ('日经中文', 'https://feedx.net/rss/nikkei.xml'),
        ('BBC中文', 'https://feedx.net/rss/bbc.xml'),
    ]
EOF

      - name: 生成 Kindle 格式电子书 AZW3
        run: ebook-convert news.recipe news.azw3 --output-profile kindle

      - name: 推送到 Kindle 邮箱
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: Convert
          from: ${{ secrets.SMTP_USER }}
          to: ${{ secrets.SEND_TO }}
          body: 今日新闻已送达
          attachments: news.azw3
