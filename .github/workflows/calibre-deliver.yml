name: Nikkei News to Kindle

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check Calibre version
        run: |
          # Calibre 已经预装，直接使用
          calibre --version
          ebook-convert --version
          
      - name: Generate Nikkei news
        run: |
          # 直接生成 MOBI 文件
          ebook-convert nikkei.recipe nikkei.mobi \
            --output-profile kindle \
            --mobi-file-type both
          
          # 查看生成的文件
          ls -lh *.mobi
          
      - name: Send to Kindle
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP }}
          server_port: 587
          username: ${{ secrets.FROM }}
          password: ${{ secrets.ENCRYPT }}
          subject: "日经新闻 $(date '+%Y-%m-%d')"
          to: ${{ secrets.TO }}
          from: ${{ secrets.FROM }}
          body: |
            📰 每日新闻推送
            生成时间: $(date '+%Y-%m-%d %H:%M:%S')
          attachments: nikkei.mobi
          
      - name: Upload for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nikkei-news
          path: "*.mobi"
          retention-days: 3
