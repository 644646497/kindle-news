name: Calibre News Delivery

on:
  schedule:
    - cron: '0 12 * * *'      # 每天 UTC 12:00 (北京时间 20:00)
  workflow_dispatch:           # 支持手动触发

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install Calibre
        run: |
          sudo -v
          wget -nv -O- https://download.calibre-ebook.com/linux-installer.sh | sudo sh /dev/stdin
          calibre --version
          
      - name: Generate news from recipes
        run: |
          mkdir -p output
          
          # 处理 nikkei.recipe
          if [ -f "nikkei.recipe" ]; then
            echo "Generating Nikkei news..."
            ebook-convert nikkei.recipe output/nikkei.mobi
          fi
          
          # 处理 recipe_list.txt 中的所有 recipe
          if [ -f "recipe_list.txt" ]; then
            while IFS= read -r recipe; do
              if [ -n "$recipe" ] && [ -f "$recipe" ]; then
                echo "Generating: $recipe"
                ebook-convert "$recipe" "output/$(basename ${recipe%.recipe}).mobi"
              fi
            done < recipe_list.txt
          fi
          
          echo "Generated files:"
          ls -lh output/
          
      - name: Send to Kindle via SMTP
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP }}
          server_port: 587
          username: ${{ secrets.FROM }}
          password: ${{ secrets.ENCRYPT }}
          subject: "Kindle News ${{ github.run_number }} - $(date '+%Y-%m-%d')"
          to: ${{ secrets.TO }}
          from: ${{ secrets.FROM }}
          body: |
            📰 Daily News Digest
            
            Generated at: $(date '+%Y-%m-%d %H:%M:%S')
            Run ID: ${{ github.run_number }}
            
            Attached files:
            $(ls -la output/*.mobi 2>/dev/null | awk '{print "  - " $9 " (" $5 " bytes)"}')
            
            ---
            Sent via GitHub Actions
          attachments: output/*.mobi
          secure: true
          
      - name: Upload artifacts (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ github.run_id }}
          path: output/
          retention-days: 7
